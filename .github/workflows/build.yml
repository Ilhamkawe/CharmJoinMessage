name: Build CharmJoinMessage

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore packages
        run: nuget restore CharmJoinMessage.csproj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        run: msbuild "CharmJoinMessage.csproj" /p:Configuration=Release /p:Platform="Any CPU" /t:Build /p:OutputPath=bin\Release\ /v:minimal
name: Build CharmJoinMessage Plugin

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CharmJoinMessage/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'CharmJoinMessage/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
      
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Find project file and setup paths
      id: setup
      shell: pwsh
      run: |
        $projectPath = $null
        $projectDir = $null
        
        if (Test-Path "CharmJoinMessage\CharmJoinMessage.csproj") {
          $projectPath = "CharmJoinMessage\CharmJoinMessage.csproj"
          $projectDir = "CharmJoinMessage"
          Write-Host "Found project in subdirectory"
        } elseif (Test-Path "CharmJoinMessage.csproj") {
          $projectPath = "CharmJoinMessage.csproj"
          $projectDir = "."
          Write-Host "Found project in root"
        } else {
          Write-Host "ERROR: Project file not found!"
          Get-ChildItem | Select-Object Name
          exit 1
        }
        
        # Use multi-line output format for GitHub Actions
        "project_path=$projectPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "project_dir=$projectDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        
        Write-Host "Project path: $projectPath"
        Write-Host "Project dir: $projectDir"
      
    - name: Check dependencies availability
      id: check_deps
      shell: pwsh
      run: |
        $projectDir = "${{ steps.setup.outputs.project_dir }}"
        
        # Check if dependencies exist in expected locations
        $depsExist = $true
        $missingDeps = @()
        
        # Check Rocket.Unturned DLLs (in Modules folder inside CharmJoinMessage)
        $rocketPath = Join-Path $projectDir "Modules\Rocket.Unturned"
        $rocketDlls = @("Rocket.API.dll", "Rocket.Core.dll", "Rocket.Unturned.dll")
        foreach ($dll in $rocketDlls) {
          $dllPath = Join-Path $rocketPath $dll
          if (-not (Test-Path $dllPath)) {
            $depsExist = $false
            $missingDeps += "Rocket: $dll"
          }
        }
        
        # Check Unity DLLs (in parent RocketRadiationStorm/lib)
        $libPath = Join-Path $projectDir "..\RocketRadiationStorm\lib"
        $unityDlls = @("UnityEngine.CoreModule.dll", "UnityEngine.dll")
        foreach ($dll in $unityDlls) {
          $dllPath = Join-Path $libPath $dll
          if (-not (Test-Path $dllPath)) {
            $depsExist = $false
            $missingDeps += "Unity: $dll"
          }
        }
        
        # Check Assembly-CSharp-firstpass (in Rocket.Unturned-master/lib)
        $firstpassPath = Join-Path $projectDir "..\RocketRadiationStorm\Rocket.Unturned-master\lib\Assembly-CSharp-firstpass.dll"
        if (-not (Test-Path $firstpassPath)) {
          $depsExist = $false
          $missingDeps += "Unity: Assembly-CSharp-firstpass.dll"
        }
        
        if (-not $depsExist) {
          Write-Host "Missing dependencies:" -ForegroundColor Yellow
          $missingDeps | ForEach-Object { Write-Host "  - $_" -ForegroundColor Yellow }
          Write-Host ""
          Write-Host "::warning::Dependencies not found. Build may fail unless dependencies are provided."
        } else {
          Write-Host "All dependencies found!" -ForegroundColor Green
        }
        
        echo "deps_exist=$depsExist" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
    - name: Build plugin
      shell: pwsh
      run: |
        $projectPath = "${{ steps.setup.outputs.project_path }}"
        $projectDir = "${{ steps.setup.outputs.project_dir }}"
        
        Write-Host "========================================"
        Write-Host "Building CharmJoinMessage Plugin"
        Write-Host "========================================"
        Write-Host "Project: $projectPath"
        Write-Host "Directory: $projectDir"
        Write-Host ""
        
        # Change to project directory
        if ($projectDir -ne ".") {
          Push-Location $projectDir
          $projectPath = Split-Path -Leaf $projectPath
        }
        
        try {
          Write-Host "Running MSBuild..."
          Write-Host "Command: msbuild `"$projectPath`" /p:Configuration=Release /p:Platform=`"Any CPU`" /t:Restore,Build /p:OutputPath=bin\Release\ /v:minimal"
          Write-Host ""
          
          msbuild "$projectPath" /p:Configuration=Release /p:Platform="Any CPU" /t:Restore,Build /p:OutputPath=bin\Release\ /v:minimal /nologo
          
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "========================================" -ForegroundColor Red
            Write-Host "BUILD FAILED (Exit Code: $exitCode)" -ForegroundColor Red
            Write-Host "========================================" -ForegroundColor Red
            Write-Host ""
            Write-Host "Common causes:" -ForegroundColor Yellow
            Write-Host "1. Missing dependencies (Rocket.Unturned DLLs)" -ForegroundColor Yellow
            Write-Host "2. Missing Unity DLLs" -ForegroundColor Yellow
            Write-Host "3. Incorrect HintPath in .csproj file" -ForegroundColor Yellow
            Write-Host ""
            Write-Host "To fix:" -ForegroundColor Yellow
            Write-Host "- Ensure Modules/Rocket.Unturned/ contains Rocket DLLs" -ForegroundColor Yellow
            Write-Host "- Ensure ../RocketRadiationStorm/lib/ contains Unity DLLs" -ForegroundColor Yellow
            Write-Host "- Ensure ../RocketRadiationStorm/Rocket.Unturned-master/lib/ contains Assembly-CSharp-firstpass.dll" -ForegroundColor Yellow
            Write-Host "- Or update .csproj to use NuGet packages instead of local references" -ForegroundColor Yellow
            exit $exitCode
          }
          
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "BUILD SUCCESSFUL!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
        } finally {
          if ($projectDir -ne ".") {
            Pop-Location
          }
        }
      
    - name: Create output directory
      shell: pwsh
      run: |
        if (-not (Test-Path "build-output")) { 
          New-Item -ItemType Directory -Path "build-output" | Out-Null 
        }
        if (-not (Test-Path "build-output\CharmJoinMessage")) { 
          New-Item -ItemType Directory -Path "build-output\CharmJoinMessage" | Out-Null 
        }
      
    - name: Copy DLL to output
      shell: pwsh
      run: |
        $projectDir = "${{ steps.setup.outputs.project_dir }}"
        $dllPath = Join-Path $projectDir "bin\Release\CharmJoinMessage.dll"
        $pdbPath = Join-Path $projectDir "bin\Release\CharmJoinMessage.pdb"
        
        Write-Host "Looking for DLL at: $dllPath"
        
        if (Test-Path $dllPath) {
          Copy-Item $dllPath "build-output\CharmJoinMessage\CharmJoinMessage.dll" -Force
          Write-Host "✓ DLL copied successfully" -ForegroundColor Green
          
          $fileInfo = Get-Item $dllPath
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1KB, 2)) KB"
        } else {
          Write-Host "ERROR: DLL not found at $dllPath" -ForegroundColor Red
          Write-Host "Searching for DLL..."
          $foundDlls = Get-ChildItem -Path . -Filter "CharmJoinMessage.dll" -Recurse -ErrorAction SilentlyContinue
          if ($foundDlls) {
            Write-Host "Found DLL(s) at:"
            $foundDlls | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "No DLL found. Build may have failed."
          }
          exit 1
        }
        
        if (Test-Path $pdbPath) {
          Copy-Item $pdbPath "build-output\CharmJoinMessage\CharmJoinMessage.pdb" -Force
          Write-Host "✓ PDB copied successfully" -ForegroundColor Green
        }
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CharmJoinMessage-Plugin
        path: build-output/CharmJoinMessage/*.dll
        retention-days: 30
        if-no-files-found: warn
