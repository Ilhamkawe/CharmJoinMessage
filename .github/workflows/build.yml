name: Build CharmJoinMessage Plugin

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CharmJoinMessage/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'CharmJoinMessage/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Find project file
      id: find_project
      shell: pwsh
      run: |
        $projectPath = $null
        $projectDir = $null
        
        if (Test-Path "CharmJoinMessage\CharmJoinMessage.csproj") {
          $projectPath = "CharmJoinMessage\CharmJoinMessage.csproj"
          $projectDir = "CharmJoinMessage"
          Write-Host "Found project in subdirectory: $projectPath"
        } elseif (Test-Path "CharmJoinMessage.csproj") {
          $projectPath = "CharmJoinMessage.csproj"
          $projectDir = "."
          Write-Host "Found project in root: $projectPath"
        } else {
          Write-Host "ERROR: Project file not found!"
          Write-Host "Current directory contents:"
          Get-ChildItem | Select-Object Name
          exit 1
        }
        
        Write-Host "project_path=$projectPath" >> $env:GITHUB_OUTPUT
        Write-Host "project_dir=$projectDir" >> $env:GITHUB_OUTPUT
      
    - name: Restore dependencies
      shell: pwsh
      run: nuget restore "${{ steps.find_project.outputs.project_path }}"
      continue-on-error: true
      
    - name: Build plugin
      shell: pwsh
      run: |
        $projectPath = "${{ steps.find_project.outputs.project_path }}"
        $projectDir = "${{ steps.find_project.outputs.project_dir }}"
        
        Write-Host "Building project: $projectPath"
        Write-Host "Working directory: $projectDir"
        
        Push-Location $projectDir
        try {
          msbuild "$projectPath" /p:Configuration=Release /p:Platform="Any CPU" /t:Restore,Build /p:OutputPath=bin\Release\ /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        } finally {
          Pop-Location
        }
      
    - name: Create output directory
      shell: pwsh
      run: |
        if (-not (Test-Path "build-output")) { New-Item -ItemType Directory -Path "build-output" | Out-Null }
        if (-not (Test-Path "build-output\CharmJoinMessage")) { New-Item -ItemType Directory -Path "build-output\CharmJoinMessage" | Out-Null }
      
    - name: Copy DLL to output
      shell: pwsh
      run: |
        $projectDir = "${{ steps.find_project.outputs.project_dir }}"
        $dllPath = Join-Path $projectDir "bin\Release\CharmJoinMessage.dll"
        $pdbPath = Join-Path $projectDir "bin\Release\CharmJoinMessage.pdb"
        
        if (Test-Path $dllPath) {
          Copy-Item $dllPath "build-output\CharmJoinMessage\CharmJoinMessage.dll" -Force
          Write-Host "DLL copied successfully"
        } else {
          Write-Host "ERROR: DLL not found at $dllPath"
          exit 1
        }
        
        if (Test-Path $pdbPath) {
          Copy-Item $pdbPath "build-output\CharmJoinMessage\CharmJoinMessage.pdb" -Force
        }
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CharmJoinMessage-Plugin
        path: build-output/CharmJoinMessage/*.dll
        retention-days: 30
